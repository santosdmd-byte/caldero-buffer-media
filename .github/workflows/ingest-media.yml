name: ingest-media
on:
  workflow_dispatch:
  push:
    paths:
      - ingest/urls.json
      - ingest/fetch.py
      - .github/workflows/ingest-media.yml
jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download, verify, and commit media
        env:
          GIT_HTTP_LOW_SPEED_LIMIT: "1000"
          GIT_HTTP_LOW_SPEED_TIME: "600"
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config http.postBuffer 524288000
          git config http.version HTTP/1.1
          python3 ingest/fetch.py
          git add dishfirst montage chefs ingest
          if git diff --cached --quiet; then
            echo "No media changes to commit"
          else
            git commit -m "Add Caldero Buffer media files (verified MD5)"
            git push
          fi
